name: TRAININGDAY official Qwen tokenizer source gate

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tokenizer-source:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check out exact public Calc oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thebrazenbeard/calc
          ref: 17e12d0f659b42732fb98e5730732aba9ff1b488
          path: .ci-calcoracle
          persist-credentials: false
      - name: Install exact raw tokenizer library
        run: python -m pip install --disable-pip-version-check 'tokenizers==0.22.1'
      - name: Check offline source-gate regressions
        run: python -m unittest -v tests.test_trainingday_official_qwen_tokenizer_source_check
      - name: Download exact public tokenizer JSON and verify SHA256
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 120 \
            --proto '=https' --proto-redir '=https' \
            'https://huggingface.co/Qwen/Qwen3.5-4B/resolve/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a/tokenizer.json' \
            --output "$RUNNER_TEMP/qwen35-tokenizer.json"
          printf '%s  %s\n' \
            '5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42' \
            "$RUNNER_TEMP/qwen35-tokenizer.json" | sha256sum --check --status
      - name: Require all 1024 public TRAIN rows through official BPE V2
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci-calcoracle/src:${{ github.workspace }}
        run: |
          python -m trainingday.official_qwen_tokenizer_source_check \
            --tokenizer "$RUNNER_TEMP/qwen35-tokenizer.json"
