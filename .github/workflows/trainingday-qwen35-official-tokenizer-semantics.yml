name: TRAININGDAY official Qwen3.5 tokenizer Unicode/ChatML semantics

on:
  push:
    branches: ["test/**"]
  pull_request:
    branches: ["test/**", main]

permissions:
  contents: read

jobs:
  public-tokenizer-semantics:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run negative fixture controls
        run: python -m unittest -v tests.test_trainingday_qwen35_official_tokenizer_semantics
      - name: Install pinned public tokenizer runtime
        run: python -m pip install --disable-pip-version-check 'tokenizers==0.22.1'
      - name: Fetch exact public tokenizer only (no weight shards)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 \
            'https://huggingface.co/Qwen/Qwen3.5-4B/resolve/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a/tokenizer.json' \
            --output "$RUNNER_TEMP/qwen35-tokenizer.json"
          printf '%s  %s\n' \
            '5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42' \
            "$RUNNER_TEMP/qwen35-tokenizer.json" | sha256sum --check
      - name: Exercise real Unicode and ChatML semantics
        run: |
          python -m trainingday.qwen35_official_tokenizer_semantics \
            --tokenizer "$RUNNER_TEMP/qwen35-tokenizer.json"
