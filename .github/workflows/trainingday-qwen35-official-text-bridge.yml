name: TRAININGDAY pinned Qwen3.5 no-shard text bridge

on:
  push:
    branches: ["trainingday/official-source-pins-20261104-subagent"]

permissions:
  contents: read

jobs:
  official-text-bridge:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download official pinned config and index only (no shards)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qwen35-metadata-only"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            --max-filesize 65536 --proto '=https' --proto-redir '=https' \
            'https://huggingface.co/Qwen/Qwen3.5-4B/resolve/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a/config.json' \
            --output "$RUNNER_TEMP/qwen35-metadata-only/config.json"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            --max-filesize 1048576 --proto '=https' --proto-redir '=https' \
            'https://huggingface.co/Qwen/Qwen3.5-4B/resolve/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a/model.safetensors.index.json' \
            --output "$RUNNER_TEMP/qwen35-metadata-only/model.safetensors.index.json"
          printf '%s  %s\n' \
            'ddc63e1c717afa86c865bb5e01313d89d72bb53b97ad4a8a03ba8510c0621670' \
            "$RUNNER_TEMP/qwen35-metadata-only/config.json" | sha256sum --check --status
          printf '%s  %s\n' \
            'cf3f798ee02ba45f9622aa8892a47369ab667d0afbf154ee7c2212de42e6302d' \
            "$RUNNER_TEMP/qwen35-metadata-only/model.safetensors.index.json" | sha256sum --check --status
      - name: Install pinned CPU-only Transformers and Accelerate
        shell: bash
        run: |
          python -m pip install --no-cache-dir --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1+cpu'
          python -m pip install --no-cache-dir --only-binary=:all: \
            'transformers==5.22.1' 'accelerate==1.12.0'
          python -m pip check
      - name: Validate 426 exact text-only regex conversions without pretrained tensors
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          export TRAININGDAY_OFFICIAL_META_DIR="$RUNNER_TEMP/qwen35-metadata-only"
          timeout --signal=TERM 150s python -m unittest -v \
            tests.test_trainingday_qwen35_official_bridge \
            | tee "$RUNNER_TEMP/qwen35-bridge-evidence.log"
          grep --quiet '^OFFICIAL_QWEN35_TEXT_BRIDGE_EVIDENCE=' \
            "$RUNNER_TEMP/qwen35-bridge-evidence.log"
