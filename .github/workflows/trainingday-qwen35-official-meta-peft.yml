name: TRAININGDAY official Qwen3.5 CPU meta-only PEFT names

on:
  push:
    branches: ["fix/trainingday-qwen35-meta-skeleton-*", "test/trainingday-qwen35-meta-text-memory-*", "test/trainingday-qwen35-official-rank4-meta-*", "test/trainingday-qwen35-rank4-adamw-*"]
  pull_request:
    branches: ["fix/trainingday-qwen35-adapter-coverage-20261103", "test/trainingday-qwen35-meta-text-memory-*", "test/trainingday-qwen35-official-rank4-meta-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-meta-peft-names:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned CPU-only meta/PEFT libraries
        shell: bash
        run: |
          python -m pip install --no-cache-dir --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.9.1+cpu'
          python -m pip install --no-cache-dir --only-binary=:all: \
            'transformers==5.22.1' 'accelerate==1.12.0' 'peft==0.21.2'
          python -m pip check
      - name: Verify zero-GPU source memory arithmetic and negative controls
        run: >-
          python -m unittest -v
          tests.test_trainingday_qwen35_meta_skeleton_probe
          tests.test_trainingday_qwen35_hybrid_rank4_meta_budget
          tests.test_trainingday_qwen35_adapter_cpu_step
      - name: Fetch only official pinned config metadata (64 KiB cap)
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            --max-filesize 65536 --proto '=https' --proto-redir '=https' \
            'https://huggingface.co/Qwen/Qwen3.5-4B/resolve/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a/config.json' \
            --output "$RUNNER_TEMP/qwen35-official-config.json"
          printf '%s  %s\n' \
            'ddc63e1c717afa86c865bb5e01313d89d72bb53b97ad4a8a03ba8510c0621670' \
            "$RUNNER_TEMP/qwen35-official-config.json" | sha256sum --check --status
      - name: Execute meta-only official text/PEFT name qualification
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          timeout --signal=TERM 150s python -m trainingday.qwen35_meta_skeleton_probe \
            --config "$RUNNER_TEMP/qwen35-official-config.json" \
            | tee "$RUNNER_TEMP/qwen35-official-meta-evidence.json"
          python - "$RUNNER_TEMP/qwen35-official-meta-evidence.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "status": "PINNED_OFFICIAL_QWEN35_TEXT_META_PEFT_NAMES_VERIFIED_ONLY",
              "meta_only": True,
              "pretrained_weights_loaded": False,
              "weight_shards_authenticated": False,
              "cuda_used": False,
              "optimizer_steps_observed": 0,
              "physical_training_authorized": False,
              "hardware_fit": "UNKNOWN",
          }
          if any(result.get(key) != value for key, value in expected.items()):
              raise SystemExit("meta-only evidence omitted or overclaimed a protected effect")
          budget = result.get("base_text_meta_memory", {})
          n = budget.get("text_parameter_elements")
          emb = budget.get("tied_embedding_parameter_elements")
          # Locked after the first real meta-skeleton hosted baseline on the
          # pinned official config and pinned Transformers/PEFT versions.
          if n != 4_205_751_296 or emb != 635_699_200:
              raise SystemExit("official text tower meta parameter count drift")
          if (type(n) is not int or type(emb) is not int or not 0 < emb < n
                  or budget.get("bf16_full_resident_weight_bytes") != 2 * n
                  or budget.get("optimistic_nf4_with_bf16_embedding_bytes")
                     != 2 * emb + (n - emb + 1) // 2
                  or budget.get("full_resident_bf16_weights_exceed_four_gib")
                     != (2 * n > 4 * 1024 ** 3)
                  or budget.get("memory_fit") != "UNKNOWN"
                  or budget.get("training_authorized") is not False):
              raise SystemExit("actual text meta memory bound malformed or overclaimed")
          PY
      - name: Measure official 152-target rank-four LoRA state on CPU meta only
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          timeout --signal=TERM 150s python -m trainingday.qwen35_hybrid_rank4_meta_budget \
            --config "$RUNNER_TEMP/qwen35-official-config.json" \
            | tee "$RUNNER_TEMP/qwen35-official-rank4-meta-evidence.json"
          python - "$RUNNER_TEMP/qwen35-official-rank4-meta-evidence.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rank4 = report.get("hybrid_rank4_adapter_state", {})
          base = report.get("base_text_meta_memory", {})
          n = rank4.get("adapter_parameter_elements")
          expected = {
              "status": "OFFICIAL_TEXT_META_HYBRID_RANK4_SOURCE_ONLY_HOLD",
              "meta_only": True,
              "pretrained_weights_loaded": False,
              "weight_shards_authenticated": False,
              "cuda_used": False,
              "optimizer_steps_observed": 0,
              "physical_training_authorized": False,
              "hardware_fit": "UNKNOWN",
          }
          if any(report.get(k) != v for k, v in expected.items()):
              raise SystemExit("hybrid meta evidence overclaimed protected effects")
          if (type(n) is not int or n != 3_594_240
                  or rank4.get("target_module_count") != 152
                  or rank4.get("trainable_lora_a_b_tensors") != 304
                  or rank4.get("optimistic_training_state_bytes") != 12 * n
                  or rank4.get("observed_meta_lora_dtypes") != ["torch.float32"]
                  or rank4.get("scenario_basis") != "OBSERVED_META_LORA_DTYPE_FP32_ONLY"
                  or rank4.get("observed_dtype_fp32_adapter_weight_bytes") != 4 * n
                  or rank4.get("observed_dtype_fp32_gradient_bytes") != 4 * n
                  or rank4.get("observed_dtype_fp32_adamw_moment_bytes") != 8 * n
                  or rank4.get("observed_dtype_fp32_training_state_bytes") != 16 * n
                  or rank4.get("optimizer_allocation_observed") is not False
                  or rank4.get("physical_fit") != "UNKNOWN"
                  or rank4.get("training_authorized") is not False
                  or base.get("text_parameter_elements") != 4_205_751_296):
              raise SystemExit("actual hybrid meta inventory or arithmetic drift")
          PY
      - name: Materialize only adapter tensors and observe one synthetic CPU AdamW step
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          timeout --signal=TERM 150s python -m trainingday.qwen35_hybrid_rank4_meta_budget \
            --config "$RUNNER_TEMP/qwen35-official-config.json" \
            --adapter-only-cpu-step \
            | tee "$RUNNER_TEMP/qwen35-rank4-adapter-only-cpu-step-evidence.json"
          python - "$RUNNER_TEMP/qwen35-rank4-adapter-only-cpu-step-evidence.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          step = report.get("adapter_only_cpu_rehearsal", {})
          n = 3_594_240
          expected = {
              "basis": "ACTUAL_PEFT_META_SHAPES_MATERIALIZED_AS_CPU_FP32",
              "adapter_only_synthetic_cpu_step": True,
              "official_backbone_forward_or_backward": False,
              "official_pretrained_weights_loaded": False,
              "device": "cpu",
              "adapter_parameter_elements": n,
              "adapter_tensor_count": 304,
              "optimizer": "torch.optim.AdamW(foreach=False,fused=False)",
              "adapter_weight_allocated_tensor_bytes": 4 * n,
              "adapter_gradient_allocated_tensor_bytes": 4 * n,
              "adamw_exp_avg_allocated_tensor_bytes": 4 * n,
              "adamw_exp_avg_sq_allocated_tensor_bytes": 4 * n,
              "adamw_step_scalar_allocated_tensor_bytes": 304 * 4,
              "sum_allocated_tensor_bytes": 16 * n + 304 * 4,
              "adapter_only_cpu_optimizer_steps_observed": 1,
              "memory_fit": "UNKNOWN",
              "physical_training_authorized": False,
          }
          if any(step.get(k) != v for k, v in expected.items()):
              raise SystemExit("actual adapter-only CPU rehearsal inventory drift")
          if (report.get("status") != "OFFICIAL_TEXT_META_HYBRID_RANK4_ADAPTER_ONLY_CPU_STEP_HOLD"
                  or report.get("meta_only") is not False
                  or report.get("pretrained_weights_loaded") is not False
                  or report.get("optimizer_steps_observed") != 0
                  or report.get("hardware_fit") != "UNKNOWN"
                  or report.get("physical_training_authorized") is not False):
              raise SystemExit("CPU rehearsal misrepresented as official-model training")
          PY
