name: Portable source checks (host integration NOT qualified)

on:
  push:
    branches: ["trainingday/**"]
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-source-only:
    name: Portable source only (11 host tests explicitly deferred)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Refuse silently skipped checks in unqualified contexts
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "false" ]; then
            echo 'This CI lane has not qualified a private-repository runner.' >&2
            exit 1
          fi
      - name: Checkout exact source HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source SHA/tree
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo 'Wrong revision checked out' >&2
            exit 1
          fi
          echo "Portable source HEAD: $actual_sha"
          echo "Portable source tree: $(git rev-parse HEAD^{tree})"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install source dependencies on CPU-only runner
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu
      - name: Run explicit portable source lane (NOT full or physical CI)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python -m pytest -q -p ci_host_boundary --portable-source-only

  host-integration-required:
    name: REQUIRED — real host integration remains NOT QUALIFIED
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed until separately authorized host evidence is reviewed
        run: |
          echo 'Eleven real D:\VERA/Lappy tests require independent host lease, NAS route, and protected-artifact authorization.' >&2
          echo 'HOST_INTEGRATION_NOT_QUALIFIED: portable-source passing is not full CI.' >&2
          exit 1
