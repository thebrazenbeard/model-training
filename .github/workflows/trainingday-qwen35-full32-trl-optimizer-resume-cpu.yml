name: TRAININGDAY tiny Qwen3.5 real masked TRL optimizer resume CPU

on:
  push:
    branches: [test/trainingday-qwen35-trl-optimizer-resume-20261103]
  pull_request:
    paths:
      - trainingday/qwen35_full32_trl_optimizer_resume_cpu.py
      - tests/test_trainingday_qwen35_full32_trl_optimizer_resume_cpu.py
      - .github/workflows/trainingday-qwen35-full32-trl-optimizer-resume-cpu.yml

jobs:
  real-optimizer-resume:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CUDA_VISIBLE_DEVICES: ''
      TRAININGDAY_QWEN_TOKENIZER_JSON: /tmp/trainingday-qwen35-official-tokenizer.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned CPU framework and model tooling
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0+cpu'
          python -m pip install --disable-pip-version-check \
            'transformers==5.22.1' 'peft==0.21.2' 'trl==1.17.1' \
            'datasets==4.7.0' 'tokenizers==0.23.3'
      - name: Download public pinned Qwen tokenizer and verify SHA-256
        env:
          HF_HUB_OFFLINE: '0'
        run: |
          curl --fail --location --retry 2 --silent --show-error \
            'https://huggingface.co/Qwen/Qwen3.5-4B/resolve/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a/tokenizer.json' \
            --output "$TRAININGDAY_QWEN_TOKENIZER_JSON"
          python -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["TRAININGDAY_QWEN_TOKENIZER_JSON"]); assert hashlib.sha256(p.read_bytes()).hexdigest()=="5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42"'
      - name: Negative checkpoint admission tests
        run: python -m unittest discover -s tests -p 'test_trainingday_qwen35_full32_trl_optimizer_resume_cpu.py' -v
      - name: Two real masked optimizer steps split across fresh CPU process
        run: python -m trainingday.qwen35_full32_trl_optimizer_resume_cpu
