name: Tests

on:
  push:
    branches: [main, "fix/**", "feature/**", "work/bv-successor-v3-task9-readiness-20260919"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu
          pip install --disable-pip-version-check --no-deps --only-binary=:all: torchao==0.18.0
      - name: Compile and test
        run: |
          python -m py_compile bootcamp.py fast_bootcamp.py quality_gate.py
          python -m pytest -q
