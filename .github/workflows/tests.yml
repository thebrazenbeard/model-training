name: Tests

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          # Source-only GGUF comparator tests run here, even without HF runtimes.
          pip install --disable-pip-version-check 'numpy==2.3.4'
      - name: Compile and test
        run: |
          python -m py_compile bootcamp.py fast_bootcamp.py quality_gate.py
          python -m pytest -q
