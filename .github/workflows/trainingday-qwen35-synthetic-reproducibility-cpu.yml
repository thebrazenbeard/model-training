name: TRAININGDAY Qwen3.5 synthetic checkpoint reproducibility CPU

on:
  push:
    branches: ["test/**"]
  pull_request:
    branches: ["test/**", main]

permissions:
  contents: read

jobs:
  synthetic-checkpoint-reproducibility:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CUDA_VISIBLE_DEVICES: ""
      WANDB_DISABLED: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "35032"
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reject altered artifact receipt controls
        run: python -m unittest discover -s tests -p test_trainingday_qwen35_synthetic_reproducibility_cpu.py -v
      - name: Install pinned public CPU Python libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0+cpu'
          python -m pip install --disable-pip-version-check \
            'transformers==5.22.1' 'peft==0.21.2' \
            'sentencepiece==0.2.1' 'numpy==2.3.4' \
            'safetensors==0.8.0' 'tokenizers==0.23.3'
          python -m pip freeze | sort
      - name: Independently repeat two full32 synthetic adapter merges and compare exact typed tensors and bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m trainingday.qwen35_synthetic_reproducibility_cpu "$RUNNER_TEMP/qwen35-repro"
