name: TrainingDay R201 Owner Source Integrity (HOLD)

on:
  push:
    paths:
      - '.github/workflows/trainingday-r201-owner-source.yml'
      - 'trainingday/r201_owner_claim_candidate.py'
      - 'tests/test_r201_owner_claim_candidate.py'
      - 'trainingday/r201_owner_offline_sign.py'
      - 'tests/test_r201_owner_offline_sign.py'
      - 'docs/TRAININGDAY_R201_OWNER_OFFLINE_SIGNING.md'
      - 'trainingday/calc_curriculum.py'
  pull_request:
    paths:
      - '.github/workflows/trainingday-r201-owner-source.yml'
      - 'trainingday/r201_owner_claim_candidate.py'
      - 'tests/test_r201_owner_claim_candidate.py'
      - 'trainingday/r201_owner_offline_sign.py'
      - 'tests/test_r201_owner_offline_sign.py'
      - 'docs/TRAININGDAY_R201_OWNER_OFFLINE_SIGNING.md'
      - 'trainingday/calc_curriculum.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-signature-contract:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install only real Ed25519 verifier
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - name: Validate signed owner evidence and offline operator contract
        run: |
          python -c 'from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; assert Ed25519PrivateKey'
          PYTHONDONTWRITEBYTECODE=1 python -m unittest -q tests.test_r201_owner_claim_candidate
          PYTHONDONTWRITEBYTECODE=1 python -m unittest -q tests.test_r201_owner_offline_sign
          echo 'R201_OWNER_SOURCE_ONLY_NO_AUTHORITY_PASS'
